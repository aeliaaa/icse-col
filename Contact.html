<div class="row">
    <div class="content">
    <h3>Fill Out the Form</h3>

    <form action="">

        
        <label for="full_name">Full Name: </label><br>
        <input type="text" id="full_name" placeholder="Enter your name" required><br><br>
        <label for="email">Email: </label><br>
        <input type="email" id="email" placeholder="Enter your email" required><br><br>
        <label for="phone">Phone Number: </label><br>
        <input type="number" id="phone" placeholder="Enter your phone number" required><br><br>
        <label for="subject">Subject: </label><br>
        <input type="text" id="subject" placeholder="Enter your subject" required><br><br>

        <label for="message">Message: </label><br>
      <textarea id="message" name="message" placeholder="Enter your message here..." required></textarea><br><br>

        <input type="submit" value="Update Message"><br><br>
        <button type="submit">Send Message</button><br><br>
    </form>
