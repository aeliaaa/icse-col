<div class="banner">

</div>
<div class="row">
    <div class="content">
    <h2>Sign Up</h2>

    <form action="">

        <label for="full_name">Full Name: </label><br>
        <input type="text" id="full_name" name="full_name" placeholder="Enter your name" required><br><br>

        <label for="username">Username: </label><br>
        <input type="text" id="username" name="username" placeholder="Enter your username" required><br><br>

        <label for="email">Email: </label><br>
        <input type="email" id="email" name="email" placeholder="Enter your email" required><br><br>

        <label for="phone">Phone Number: </label><br>
        <input type="number" id="phone" name="phone" placeholder="Enter your phone number" required><br><br>

        <label for="password">Password: </label><br>
        <input type="password" id="password" name="password" placeholder="Enter your password" required><br><br>

        <label for="confirm_password">Confirm Password: </label><br>
        <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm your password" required><br><br>

        <input type="checkbox" id="Terms_and_Conditions" name="Terms_and_Conditions" value="accepted"> <label for="Terms_and_Conditions">I agree to the Terms and Conditions</label><br><br>

        <button type="submit">Sign Up</button><br><br>
        
    </form>
